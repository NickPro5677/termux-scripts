# ============================================================
# Configuración de batería — edita solo este archivo
# ============================================================

# Ruta del CSV de registro (accesible desde el teléfono)
LOGFILE="$HOME/storage/shared/battery_log.csv"

# Cada cuántos segundos registrar (logger)
# 300 = 5 min | 60 = 1 min | 600 = 10 min
LOGGER_INTERVAL=300

# Cada cuántos segundos refrescar la pantalla (monitor)
MONITOR_INTERVAL=5

# Mostrar corriente en mA (sí) o en µA crudos (no)
# termux-battery-status devuelve microamperios
CURRENT_IN_MA=si

# Archivo PID del logger en segundo plano
PIDFILE="$HOME/scripts/logs/battery_logger.pid"

# Log de errores del logger en segundo plano
LOGGER_ERRLOG="$HOME/scripts/logs/battery_logger.err"
