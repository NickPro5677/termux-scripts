# ============================================================
# Configuración — Organizador completo del teléfono
# Redmi Note 11 / Termux
# Edita solo este archivo para personalizar.
# ============================================================

# Raíz del almacenamiento compartido
SHARED="$HOME/storage/shared"

# ------------------------------------------------------------
# MODO SEGURO
# ------------------------------------------------------------
# si  = solo muestra qué haría (RECOMENDADO la primera vez)
# no = mueve de verdad
DRY_RUN="si"

# si = pide confirmación antes de mover (aunque DRY_RUN=no)
CONFIRMAR="si"

# ------------------------------------------------------------
# Destinos por TIPO de archivo (donde queda cada categoría)
# ------------------------------------------------------------
DEST_IMAGENES="$SHARED/Pictures/Organizado"
DEST_VIDEOS="$SHARED/Movies/Organizado"
DEST_AUDIO="$SHARED/Music/Organizado"
DEST_DOCUMENTOS="$SHARED/Documents/Organizado"
DEST_APK="$SHARED/Download/Organizado/APK"
DEST_COMPRIMIDOS="$SHARED/Download/Organizado/Comprimidos"
DEST_CODIGO="$SHARED/Documents/Organizado/Codigo"
DEST_FUENTES="$SHARED/Fonts"
DEST_OTROS="$SHARED/Download/Organizado/Otros"

# Subcarpeta extra según origen (si / no)
# Ejemplo: Pictures/Organizado/SnapTube/video.mp4
USAR_SUBCARPETA_ORIGEN="si"

# ------------------------------------------------------------
# Zonas a escanear (origen|profundidad_max|etiqueta)
# profundidad 1 = solo archivos sueltos en esa carpeta
# profundidad 0 = sin límite (cuidado)
# ------------------------------------------------------------
# Formato:  RUTA|PROFUNDIDAD|ETIQUETA
ZONAS=(
  "$SHARED|1|Raiz"
  "$SHARED/Download|1|Descargas"
  "$SHARED/Download/X|2|Twitter_X"
  "$SHARED/Download/Después borrar|2|ParaBorrar"
  "$SHARED/Pictures|1|Pictures_sueltos"
  "$SHARED/Music|1|Music_sueltos"
  "$SHARED/Movies|1|Movies_sueltos"
  "$SHARED/Documents|1|Documents_sueltos"
  "$SHARED/TikTok_Videos|1|TikTok"
  "$SHARED/snaptube/download|3|SnapTube"
  "$SHARED/Download/snaptube|3|SnapTube_DL"
  "$SHARED/Xender|3|Xender"
  "$SHARED/Temporal|1|Temporal"
)

# ------------------------------------------------------------
# Carpetas / rutas que NUNCA se tocan
# ------------------------------------------------------------
PROTEGIDAS=(
  "Android"
  "MIUI"
  "DCIM"
  "proyectos"
  "StardewValley"
  "UE4Game"
  "CholoDroid-Ishiruka"
  "TermuxBackup_20260802"
  "backups"
  "MyReport_Backups"
  "Kwai-video-live"
  "MANGA"
  "1Videomaker"
  "voip-data"
  "com.xiaomi.bluetooth"
  "Ringtones"
  "ramdump"
  # Destinos del propio organizador (evitar re-mover)
  "Pictures/Organizado"
  "Movies/Organizado"
  "Music/Organizado"
  "Documents/Organizado"
  "Download/Organizado"
  # Ya clasificado por el organizador viejo de Descargas
  "Download/APK"
  "Download/Documentos"
  "Download/Imagenes"
  "Download/Videos"
  "Download/Audio"
  "Download/Comprimidos"
  "Download/Otros"
  # Obsidian / estudio (no desarmar carpetas de trabajo)
  "Documents/Alcibiades Reinoza "
  "Documents/Semestre 1 - Ingeniería en informática "
  "Documents/MisDocumentos"
  "Documents/All Maths Formulas"
  "Documents/user"
)

# WhatsApp vive en Android/media — MOVER rompe los chats.
# Déjalo en "no" salvo que sepas lo que haces.
INCLUIR_WHATSAPP="no"

# ------------------------------------------------------------
# Qué ignorar (nombres / extensiones basura)
# ------------------------------------------------------------
# Archivos ocultos (empiezan por .)
IGNORAR_OCULTOS="si"

# Extensiones / sufijos a saltar (temporales, bases de datos de apps)
IGNORAR_EXT=(
  tmp part crdownload download partial
  db db-journal db-wal db-shm
  nomedia thumbdata thumbdata3
  plist
)

# Nombres exactos a no mover (en cualquier zona)
IGNORAR_NOMBRES=(
  battery_log.csv
  ".nomedia"
)

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------
LOGDIR="$HOME/scripts/logs"
# Informe CSV de lo movido (útil para deshacer a mano)
INFORME_CSV="$HOME/scripts/reportes/organizar_ultimo.csv"

# ------------------------------------------------------------
# Notas Redmi Note 11
# ------------------------------------------------------------
# • TikTok_Videos (~13 GB) y SnapTube son las zonas más pesadas.
# • No se toca DCIM/Camera (fotos de la cámara).
# • WhatsApp está en Android/media — déjalo en INCLUIR_WHATSAPP=no.
# • Tras organizar, la Galería puede tardar en indexar Organizado/.
